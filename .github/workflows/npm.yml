name: npm
# Triggered by cron-job.org via the workflow_dispatch API:
#   curl -X POST -H "Accept: application/vnd.github+json" \
#        -H "Authorization: Bearer $GITHUB_TOKEN" \
#        https://api.github.com/repos/preetbiswas12/legion/actions/workflows/npm.yml/dispatches \
#        -d '{"ref":"main"}'
on:
  workflow_dispatch:

jobs:
  install-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          for i in {1..10000}; do
            npm cache clean --force
            npm install -g @legioncli/cli
            npm uninstall -g @legioncli/cli
          done
