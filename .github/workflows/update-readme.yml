name: Update npm README Only

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://npmjs.org"

      - name: Dynamic manifest generation and publish
        run: |
          # 1. Fetch current production version reference from npm registry
          LATEST_VERSION=$(npm view @legioncli/cli version 2>/dev/null || echo "2.4.4")
          echo "Current package registry version: $LATEST_VERSION"
          
          # 2. Increment the patch index for the main wrapper
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
          NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH+1))"
          echo "Target readme-only version: $NEW_VERSION"

          # 3. Target local package construction sandbox zone
          mkdir -p packages/opencode/dist/@legioncli/cli
          cd packages/opencode

          # 4. Copy existing baseline repository files
          cp -r bin dist/@legioncli/cli/bin
          cp script/postinstall.mjs dist/@legioncli/cli/postinstall.mjs
          cp ../../LICENSE dist/@legioncli/cli/LICENSE
          
          # 5. FIX: Pull your newly saved README directly from the same local folder context
          cp README.md dist/@legioncli/cli/README.md

          # 6. Lock optional dependencies specifically to the existing live registry version
          OPTIONAL_DEPS="{}"
          for dir in dist/@legioncli/cli-*/; do
            if [ -d "$dir" ]; then
              PLATFORM_NAME=$(cat "$dir/package.json" | grep '"name"' | head -1 | sed 's/.*: *"//;s/".*//')
              OPTIONAL_DEPS=$(echo "$OPTIONAL_DEPS" | node -e "
                const fs = require('fs');
                const data = JSON.parse(fs.readFileSync('/dev/stdin', 'utf8'));
                data['$PLATFORM_NAME'] = '$LATEST_VERSION';
                console.log(JSON.stringify(data));
              ")
            fi
          done

          # 7. Generate a pristine package.json file satisfying explicit formatting rules
          node -e "
            const fs = require('fs');
            const pkg = {
              name: '@legioncli/cli',
              version: '$NEW_VERSION',
              bin: {
                legion: 'bin/legion',
                legioncli: 'bin/legion'
              },
              scripts: {
                postinstall: 'node ./postinstall.mjs'
              },
              license: 'MIT',
              repository: {
                type: 'git',
                url: 'https://github.com'
              },
              os: ['darwin', 'linux', 'win32'],
              cpu: ['arm64', 'x64'],
              private: false,
              optionalDependencies: JSON.parse(process.argv)
            };
            fs.writeFileSync('dist/@legioncli/cli/package.json', JSON.stringify(pkg, null, 2));
          " "$OPTIONAL_DEPS"

          # 8. Ship the hotfix package containing your updated readme layout directly to npm
          cd dist/@legioncli/cli
          echo "Publishing documentation patch release..."
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
