name: Update npm README Only

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Target version number (e.g. 2.4.7)"
        required: false
        type: string

permissions:
  id-token: write
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Dynamic manifest generation and publish
        run: |
          # 1. Resolve target version number
          if [ -n "${{ inputs.version }}" ]; then
            TARGET_VERSION="${{ inputs.version }}"
            echo "Target version explicitly requested: $TARGET_VERSION"
          else
            LATEST_VERSION=$(npm view @legioncli/cli version 2>/dev/null || echo "2.4.4")
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
            TARGET_VERSION="${MAJOR}.${MINOR}.$((PATCH+1))"
            echo "No version provided. Auto-incremented to target version: $TARGET_VERSION"
          fi

          # 2. Enter workspace source directory
          cd packages/opencode
          mkdir -p dist

          # 3. Step A: Loop through and publish all platform target placeholders programmatically
          PLATFORMS=("darwin-arm64" "darwin-x64" "linux-arm64" "linux-x64" "win32-x64")
          OPTIONAL_DEPS="{}"

          for PLATFORM in "${PLATFORMS[@]}"; do
            PKG_NAME="@legioncli/cli-${PLATFORM}"
            echo "Synchronizing platform package $PKG_NAME to $TARGET_VERSION..."
            
            # Construct a fully independent placeholder folder structure
            PLATFORM_DIR="dist/$PKG_NAME"
            mkdir -p "$PLATFORM_DIR"
            
            # Map the clean platform manifest file directly
            node -e "
              const fs = require('fs');
              const pkg = {
                name: '$PKG_NAME',
                version: '$TARGET_VERSION',
                description: 'Platform binary placeholder for Legion CLI',
                repository: { type: 'git', url: 'https://github.com' },
                license: 'MIT',
                private: false
              };
              fs.writeFileSync('$PLATFORM_DIR/package.json', JSON.stringify(pkg, null, 2));
            "

            # Publish the platform placeholder directly to open the dependency path
            cd "$PLATFORM_DIR"
            if npm view "${PKG_NAME}@${TARGET_VERSION}" version >/dev/null 2>&1; then
              echo "Already published ${PKG_NAME}@${TARGET_VERSION}, skipping"
            else
              npm publish --access public || echo "Warning: $PKG_NAME push skipped or already live"
            fi
            cd -

            # Append this platform entry to our main optionalDependencies string definition
            OPTIONAL_DEPS=$(echo "$OPTIONAL_DEPS" | node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync('/dev/stdin', 'utf8'));
              data['$PKG_NAME'] = '$TARGET_VERSION';
              console.log(JSON.stringify(data));
            ")
          done

          # 4. Step B: Setup main wrapper container file assets
          mkdir -p dist/@legioncli/cli
          cp -r bin dist/@legioncli/cli/bin
          cp script/postinstall.mjs dist/@legioncli/cli/postinstall.mjs
          cp ../../LICENSE dist/@legioncli/cli/LICENSE
          cp README.md dist/@legioncli/cli/README.md

          # 5. Generate clean wrapper package.json file matching the new version mapping
          export OPTIONAL_DEPS
          node -e "
            const fs = require('fs');
            const pkg = {
              name: '@legioncli/cli',
              version: '$TARGET_VERSION',
              bin: {
                legion: 'bin/legion',
                legioncli: 'bin/legion'
              },
              scripts: {
                postinstall: 'node ./postinstall.mjs'
              },
              license: 'MIT',
              repository: {
                type: 'git',
                url: 'https://github.com'
              },
              os: ['darwin', 'linux', 'win32'],
              cpu: ['arm64', 'x64'],
              private: false,
              optionalDependencies: JSON.parse(process.env.OPTIONAL_DEPS)
            };
            fs.writeFileSync('dist/@legioncli/cli/package.json', JSON.stringify(pkg, null, 2));
          "

          # 6. Ship the main wrapper containing your updated readme layout directly to npm
          cd dist/@legioncli/cli
          echo "Publishing main documentation package release..."
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
